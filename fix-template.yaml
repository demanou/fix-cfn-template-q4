AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Sample CloudFormation template with intentional errors
  for students to troubleshoot EC2 provisioning.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: The environment name (dev or prod).

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
    Description: EC2 instance type.

  AMIId:
    Type: String
    Default: ami-0bf6dbeae330f5823
    Description: The AMI ID to use.

  VpcID:
    Description: "Enter your VPC ID"
    Default: "vpc-03aa2d44aeeee4e02"
    Type: String

  SubnetID:
    Type: String
    Description: "Enter your Subnet ID"
    Default: "subnet-08c44f4adae36b232"

  KeyPair:
    Type: String
    Description: "Enter your Key Pair"
    Default: "dnag-kp"

Resources:
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AMIId
      KeyName: !Ref KeyPair
      SubnetId: !Ref SubnetID
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup  
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-instance"

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH access
      VpcId: !Ref VpcID
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

Outputs:
  InstanceId:
    Description: The ID of the EC2 instance
    Value: !Ref EC2Instance

  InstancePublicIp:
    Description: Public IP address of the EC2 instance
    Value: !GetAtt EC2Instance.PublicIp